spring.application.name=demo


server.port=8080

#日志配置
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.context=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n



#模型api配置
deepseek.api-key=${deepseek.api-key}
deepseek.model-name=deepseek-v4-flash
deepseek.base-url=https://api.deepseek.com

qianwen.api-key=${qianwen.api-key}
qianwen.model-name=qwen3.7-flash-2026-07-15
qianwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1

spring.data.mongodb.uri=mongodb://localhost:27017/ai
